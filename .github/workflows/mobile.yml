name: Mobile

on:
  pull_request:
    paths:
      - ".github/workflows/mobile.yml"
      - "mobile/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile.yml"
      - "mobile/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      signed:
        description: "Build a release-signed APK instead of the debug one."
        type: boolean
        default: false
      version-name:
        description: "versionName for a signed build; ignored otherwise."
        type: string
        default: ""
      version-code:
        description: "versionCode for a signed build; ignored otherwise."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      WAMBRIDGE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      WAMBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      WAMBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      WAMBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          test -d "$ANDROID_HOME/platforms/android-37.0" || "$sdkmanager" "platforms;android-37.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0" || "$sdkmanager" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build Android adapter
        if: ${{ !inputs.signed }}
        working-directory: mobile
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !inputs.signed }}
        with:
          name: wambridge-mobile-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare signing
        if: ${{ inputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$WAMBRIDGE_KEYSTORE_BASE64" \
                       "$WAMBRIDGE_KEYSTORE_PASSWORD" \
                       "$WAMBRIDGE_KEY_ALIAS" \
                       "$WAMBRIDGE_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "A signed build needs KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD" >&2
              exit 1
            fi
          done
          printf '%s' "$WAMBRIDGE_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/wambridge-release.keystore"
          echo "WAMBRIDGE_KEYSTORE_PATH=$RUNNER_TEMP/wambridge-release.keystore" >> "$GITHUB_ENV"

      - name: Build the signed APK
        if: ${{ inputs.signed }}
        working-directory: mobile
        shell: bash
        env:
          VERSION: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          ./gradlew :app:lintRelease :app:assembleRelease \
            "-PwamVersionName=$VERSION" \
            "-PwamVersionCode=$VERSION_CODE"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/wambridge-${VERSION}.apk"

      - name: Verify the signature
        if: ${{ inputs.signed }}
        working-directory: mobile
        shell: bash
        env:
          VERSION: ${{ inputs.version-name }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "dist/wambridge-${VERSION}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.signed }}
        with:
          name: wambridge-apk
          path: mobile/dist/wambridge-*.apk
          if-no-files-found: error
